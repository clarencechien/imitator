<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>熄燈的窗 · Motion Deck Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0d10; --fg:#f2eee6; --dim:#8b909a; --faint:#2a2d34; --line:#3a3e47;
  --amber:#ffb547; --red:#ff4d3d; --cyan:#5cc8ff;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC",serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050506;color:var(--fg);font-family:var(--sans);overflow:hidden}
#viewport{position:fixed;inset:0 0 56px 0;display:grid;place-items:center}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:0 0;background:var(--bg);overflow:hidden}
.scene{position:absolute;inset:0;opacity:0;pointer-events:none}
.abs{position:absolute}
.mono{font-family:var(--mono)}
.kicker{position:absolute;left:120px;top:70px;font:500 20px/1 var(--mono);letter-spacing:.28em;color:var(--amber);text-transform:uppercase}
.kin{display:inline-block;will-change:transform,opacity;white-space:pre}
.big{font-weight:900;letter-spacing:-.02em}
svg text{font-family:var(--mono)}
.cell{position:absolute;width:40px;height:40px;border:1.5px solid var(--faint)}
.cell i{position:absolute;inset:3px;opacity:0}
.cell i.a{background:var(--amber);box-shadow:0 0 18px rgba(255,181,71,.55)}
.cell i.r{background:var(--red)}
.cell b{position:absolute;inset:-1.5px;border:1.5px solid var(--red);opacity:0}
.door{position:absolute;width:22px;background:var(--fg)}
/* controls */
#bar{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 18px;background:#0b0b0d;border-top:1px solid #1e2026;font:500 13px/1 var(--mono);color:var(--dim)}
#bar button{background:none;border:1px solid #2a2d34;color:var(--fg);height:34px;min-width:38px;padding:0 10px;font:inherit;cursor:pointer;border-radius:6px}
#bar button:hover{border-color:var(--amber);color:var(--amber)}
#bar button.on{border-color:var(--amber);color:var(--amber)}
#track{position:relative;flex:1;height:34px;cursor:pointer;display:flex;gap:3px;align-items:center}
#track .seg{position:relative;height:6px;background:#1f2228;border-radius:3px;overflow:hidden}
#track .seg span{position:absolute;inset:0;background:var(--amber);transform-origin:0 50%;transform:scaleX(0)}
#time{min-width:92px;text-align:right}
#md{position:fixed;right:18px;bottom:72px;width:min(460px,calc(100vw - 36px));max-height:60vh;overflow:auto;background:rgba(14,15,18,.94);border:1px solid #2a2d34;border-left:3px solid var(--amber);border-radius:8px;padding:14px 16px;display:none;z-index:5}
#md.show{display:block}
#md h4{margin:0 0 8px;font:500 12px/1.4 var(--mono);letter-spacing:.16em;color:var(--amber)}
#md pre{margin:0;font:13px/1.65 var(--mono);color:#d8d4cb;white-space:pre-wrap}
#md p{margin:10px 0 0;font:12.5px/1.7 var(--sans);color:var(--dim)}
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<div id="md"><h4 id="mdh"></h4><pre id="mdpre"></pre><p id="mdnote"></p></div>
<div id="bar">
  <button id="prev" title="上一幕 (←)">‹</button>
  <button id="play" title="播放/暫停 (Space)">❙❙</button>
  <button id="next" title="下一幕 (→)">›</button>
  <div id="track"></div>
  <span id="time">00.0 / 00.0</span>
  <button id="mdbtn" title="這一幕的 MD 原始碼 (M)">MD</button>
  <button id="fs" title="全螢幕 (F)">⛶</button>
</div>

<script>
/* ───────────── tiny deterministic motion engine ─────────────
   Every scene is a PURE function of its local time t (seconds).
   That makes the whole deck seekable: scrub, jump, or step frames
   for an mp4 export — no state accumulates between frames. */
const W=1600,H=900;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const seg=(t,a,d)=>clamp((t-a)/d);
const lerp=(a,b,p)=>a+(b-a)*p;
const E={
  outExpo:p=>p>=1?1:1-Math.pow(2,-10*p),
  outCubic:p=>1-Math.pow(1-p,3),
  inOut:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,
  outBack:(p,s=1.9)=>1+(s+1)*Math.pow(p-1,3)+s*Math.pow(p-1,2),
};
const fmt=n=>Math.round(n).toLocaleString('en-US');
const NS='http://www.w3.org/2000/svg';
function el(tag,css,parent,html){const e=document.createElement(tag);if(css)e.style.cssText=css;if(html!=null)e.innerHTML=html;parent&&parent.appendChild(e);return e;}
function sv(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e;}
// kinetic text: split into spans, animate per character
function kinText(parent,text,css){
  const box=el('div','position:absolute;'+css,parent);
  const spans=[...text].map(ch=>{const s=el('span',null,box);s.className='kin';s.textContent=ch;return s;});
  return {box,play(t,start,{stagger=.035,dur=.55,dy=70,blur=true}={}){
    spans.forEach((s,i)=>{const p=seg(t,start+i*stagger,dur),e=E.outExpo(p);
      s.style.opacity=p; s.style.transform=`translateY(${(1-e)*dy}px)`; s.style.filter=blur?`blur(${(1-e)*8}px)`:'';});
  }};
}
// slam: scale from big to 1 with overshoot
function slam(node,t,start,{from=2.4,dur=.5}={}){
  const p=seg(t,start,dur); node.style.opacity=clamp(p*3);
  node.style.transform=`scale(${lerp(from,1,E.outExpo(p))})`;
}
// partial polyline for line-draw
function partial(pts,p){
  const n=pts.length-1,f=p*n,k=Math.floor(f),r=f-k;
  const out=pts.slice(0,k+1);
  if(k<n){const a=pts[k],b=pts[k+1];out.push([lerp(a[0],b[0],r),lerp(a[1],b[1],r)]);}
  return {d:'M'+out.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' L'),tip:out[out.length-1]};
}
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};

/* ───────────── data ───────────── */
const PIR={2002:4.26,2003:4.59,2004:4.84,2005:4.97,2006:4.97,2007:5.76,2008:5.87,2009:6.67,2010:7.11,2011:7.29,2012:7.79,2013:8.37,2014:8.41,2015:8.51,2016:9.32,2017:9.16,2018:8.57,2019:8.58,2020:9.2,2021:9.46,2022:9.61,2023:9.97,2024:10.76,2025:9.71};
const BIRTHS={2016:208440,2017:193844,2018:181601,2019:177767,2020:165249,2021:153820,2022:138986,2023:135571,2024:134856,2025:107812};
const COUNTY=[["雲林縣",7.31,6.94],["臺東縣",8.27,5.83],["桃園市",8.65,5.64],["彰化縣",8.65,5.54],["新竹市",8.62,5.28],["臺北市",15.41,5.16],["新竹縣",9.27,4.79],["花蓮縣",9.10,4.69],["屏東縣",7.30,4.58],["高雄市",9.61,4.57],["臺中市",11.90,4.44],["苗栗縣",7.82,4.38],["嘉義市",7.58,4.37],["南投縣",9.01,4.31],["宜蘭縣",8.39,4.26],["臺南市",9.38,3.86],["新北市",13.03,3.79],["嘉義縣",6.95,3.56],["基隆市",6.05,2.89]];

/* ───────────── scenes ───────────── */
const scenes=[];

/* 01 · the wall */
scenes.push({name:'十年少一半',dur:13,
md:`::: wall from=208440 to=107812 per=1000
year: 2016 → 2025
# 十年，少了一半。
:::`,
note:'一個「格子牆」primitive：from/to/per 三個參數就能生出整幕。適合任何「數量消失」的故事。',
build(root){
  const cam=el('div','position:absolute;inset:0;transform-origin:50% 45%',root);
  const yr=el('div','left:120px;top:70px;font:500 22px/1 var(--mono);letter-spacing:.28em;color:var(--amber)',cam);yr.className='abs';
  const num=el('div','left:112px;top:104px;font:700 104px/1 var(--mono);letter-spacing:-.03em;transform-origin:0 50%',cam);num.className='abs';
  const unit=el('div','left:120px;top:222px;font:400 22px/1 var(--sans);color:var(--dim)',cam,'個新生兒 · 每一格是一千個孩子');unit.className='abs';
  const grid=el('div','position:absolute;left:'+(W-1265)/2+'px;top:286px;width:1265px;height:392px',cam);
  const cells=[];
  for(let i=0;i<208;i++){const c=i%26,r=Math.floor(i/26);
    const d=el('div',`left:${c*49}px;top:${r*49}px`,grid);d.className='cell';
    const a=el('i',null,d);a.className='a';const rr=el('i',null,d);rr.className='r';const b=el('b',null,d);
    cells.push({a,r:rr,b,on:.4+(c+r*1.6)/(25+7*1.6)*2.4,off:i>=108?6+(207-i)/100*2.8:1e9});}
  const head=kinText(cam,'十年，少了一半。','left:120px;top:712px;font:900 112px/1.1 var(--sans);letter-spacing:-.02em');
  return t=>{
    cam.style.transform=`scale(${1+.07*E.inOut(seg(t,0,13))})`;
    const down=t>=6;
    yr.textContent=down?String(Math.round(lerp(2016,2025,E.inOut(seg(t,6,2.8))))):'2016';
    num.textContent=fmt(down?lerp(208440,107812,E.inOut(seg(t,6,2.8))):lerp(0,208440,E.outCubic(seg(t,.4,2.6))));
    const punch=seg(t,8.85,.45); num.style.transform=`scale(${1+.16*Math.sin(Math.PI*punch)})`;
    num.style.color=t>8.8?'var(--red)':'var(--fg)';
    grid.style.opacity=1-.55*seg(t,9.2,.8);
    for(const c of cells){
      c.a.style.opacity=seg(t,c.on,.18)*(1-seg(t,c.off,.06));
      c.r.style.opacity=t<c.off?0:1-seg(t,c.off+.12,.5);
      c.b.style.opacity=.55*seg(t,c.off,.3);
    }
    head.play(t,9.4,{stagger:.06});
  };}});

/* 02 · still falling */
scenes.push({name:'還沒見底',dur:6,
md:`::: delta
label: 2026 年 1–8 月
value: -11000+
caption: 比 2025 同期又少了一萬多人。還沒見底。
:::`,
note:'「大數字 slam」primitive，SnapDeck 現有的「大數字」版型加上一個進場動作即可。',
build(root){
  el('div',null,root,'<div class="kicker">2026 · 1 – 8 月</div>');
  const months=[];for(let m=0;m<12;m++){const b=el('div',`left:${120+m*114}px;top:150px;width:100px;height:56px;border:1.5px solid var(--line);font:500 16px/56px var(--mono);text-align:center;color:var(--dim)`,root);b.className='abs';
    const f=el('div','position:absolute;inset:0;background:var(--amber);transform-origin:0 50%;transform:scaleX(0)',b);months.push(f);
    const lb=el('span','position:relative;color:'+(m<8?'#111':'var(--dim)'),b,(m+1)+'月');}
  const n=el('div','left:0;right:0;top:300px;text-align:center;font:700 230px/1 var(--mono);color:var(--red);letter-spacing:-.04em',root,'−11,000+');n.className='abs';
  const cap=kinText(root,'比 2025 同期又少了一萬多人。還沒見底。','left:0;right:0;top:600px;text-align:center;font:700 52px/1.3 var(--sans)');
  const sub=el('div','left:0;right:0;top:690px;text-align:center;font:400 22px/1 var(--mono);color:var(--dim)',root,'累計出生 61,742 人 · 內政部 2026.09');sub.className='abs';
  return t=>{months.forEach((f,i)=>{f.style.transform=`scaleX(${i<8?E.outExpo(seg(t,.3+i*.18,.35)):0})`;f.style.opacity=.9});
    slam(n,t,2.2,{from:2.6,dur:.6}); cap.play(t,3.2,{stagger:.03}); sub.style.opacity=seg(t,4.4,.5);};}});

/* 03 · the suspect */
scenes.push({name:'嫌疑犯',dur:8,
md:`::: line y="房價所得比" unit="倍" follow
2002: 4.26
2016: 9.32
2024: 10.76
2025: 9.71
# 嫌疑犯：房價所得比 ×2.5
:::`,
note:'「折線 + 跟隨數字」primitive：畫線時尖端帶著數值與年份走，是影片感最強也最便宜的一招。',
build(root){
  el('div',null,root,'<div class="kicker">嫌疑犯</div>');
  const title=kinText(root,'房價所得比','left:120px;top:110px;font:900 76px/1 var(--sans)');
  const s=sv('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H,style:'position:absolute;inset:0'},root);
  const X=y=>200+(y-2002)/23*1240, Y=v=>790-v/12*560;
  const grid=sv('g',{},s);
  [0,3,6,9,12].forEach(v=>{sv('line',{x1:200,x2:1440,y1:Y(v),y2:Y(v),stroke:'#23262d','stroke-width':1.5},grid);const tx=sv('text',{x:180,y:Y(v)+7,'text-anchor':'end',fill:'#6d727c','font-size':20},grid);tx.textContent=v+'倍';});
  [2002,2008,2014,2020,2025].forEach(y=>{const tx=sv('text',{x:X(y),y:830,'text-anchor':'middle',fill:'#6d727c','font-size':20},grid);tx.textContent=y;});
  const pts=Object.keys(PIR).map(y=>[X(+y),Y(PIR[y])]);
  const area=sv('path',{fill:'rgba(255,181,71,.10)'},s);
  const path=sv('path',{fill:'none',stroke:'var(--amber)','stroke-width':6,'stroke-linecap':'round','stroke-linejoin':'round'},s);
  const dot=sv('circle',{r:12,fill:'var(--amber)'},s);
  const tipV=sv('text',{fill:'var(--fg)','font-size':64,'font-weight':700},s);
  const tipY=sv('text',{fill:'var(--dim)','font-size':22},s);
  const fin=el('div','right:150px;top:150px;text-align:right',root,'<div style="font:700 120px/1 var(--mono);color:var(--amber)">×2.5</div><div style="font:700 36px/1.4 var(--sans);margin-top:10px">不吃不喝十年，<br>才買得起一戶房子</div>');fin.className='abs';
  const yrs=Object.keys(PIR);
  return t=>{title.play(t,.2);grid.style.opacity=seg(t,.3,.6);
    const p=E.inOut(seg(t,.8,4.4)),r=partial(pts,p);
    path.setAttribute('d',r.d); area.setAttribute('d',r.d+` L${r.tip[0]},790 L200,790 Z`);
    dot.setAttribute('cx',r.tip[0]);dot.setAttribute('cy',r.tip[1]);dot.style.opacity=seg(t,.8,.2);
    const idx=Math.min(yrs.length-1,Math.round(p*(yrs.length-1)));
    const v=lerp(4.26,PIR[yrs[idx]],1);
    tipV.textContent=PIR[yrs[idx]].toFixed(2);tipY.textContent=yrs[idx];
    tipV.setAttribute('x',r.tip[0]-30);tipV.setAttribute('y',r.tip[1]-34);tipV.setAttribute('text-anchor','end');
    tipY.setAttribute('x',r.tip[0]-30);tipY.setAttribute('y',r.tip[1]-104);tipY.setAttribute('text-anchor','end');
    tipV.style.opacity=tipY.style.opacity=seg(t,.9,.3)*(1-seg(t,5.3,.4));
    fin.style.opacity=seg(t,5.4,.4);fin.style.transform=`translateY(${(1-E.outExpo(seg(t,5.4,.6)))*40}px)`;};}});

/* 04 · case closed? */
scenes.push({name:'看起來可以結案',dur:6.5,
md:`::: beats
- 兩條線。
- 一份民調。
- 一份審計報告。
> 看起來，可以結案了。
stamp: 結案？
:::`,
note:'「節拍字卡」primitive：清單每一項是一拍，最後的引言是重音。stamp 是可選的蓋章動作。',
build(root){
  const ls=['兩條線。','一份民調。','一份審計報告。'].map((s,i)=>kinText(root,s,`left:160px;top:${180+i*120}px;font:900 92px/1 var(--sans)`));
  const q=kinText(root,'看起來，可以結案了。',`left:160px;top:600px;font:900 84px/1 var(--serif);color:var(--amber)`);
  const st=el('div','left:1060px;top:170px;padding:14px 34px;border:8px solid var(--red);color:var(--red);font:900 110px/1 var(--sans);transform-origin:50% 50%',root,'結案？');st.className='abs';
  return t=>{ls.forEach((l,i)=>{l.play(t,.25+i*.6,{stagger:.04});l.box.style.opacity=1-.7*seg(t,2.7,.4);});
    q.play(t,3.0,{stagger:.05});
    const p=seg(t,4.4,.35);st.style.opacity=clamp(p*4);st.style.transform=`rotate(-8deg) scale(${lerp(3,1,E.outBack(p,1.4))})`;};}});

/* 05 · counter-evidence: time */
scenes.push({name:'反證 01 時間',dur:8.5,
md:`::: index base=2016 compare
出生數: 208440 193844 181601 … 107812
房價所得比: 9.32 9.16 8.57 … 9.71
band: 2016-2019, 2024-2025 "房價所得比下降"
# 房子便宜了，孩子沒有回來。
:::`,
note:'「指數化雙線 + 區間色帶」primitive：兩個不同單位的序列先換成同一個基期，避免雙 y 軸。',
build(root){
  el('div',null,root,'<div class="kicker">反證 01 · 時間</div>');
  const s=sv('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H,style:'position:absolute;inset:0'},root);
  const X=y=>200+(y-2016)/9*820, Y=v=>720-(v-40)/80*520;
  const g=sv('g',{},s);
  [40,60,80,100,120].forEach(v=>{sv('line',{x1:200,x2:1020,y1:Y(v),y2:Y(v),stroke:v===100?'#6d727c':'#23262d','stroke-width':v===100?2:1.5},g);const tx=sv('text',{x:180,y:Y(v)+7,'text-anchor':'end',fill:'#6d727c','font-size':20},g);tx.textContent=v;});
  [2016,2019,2022,2025].forEach(y=>{const tx=sv('text',{x:X(y),y:760,'text-anchor':'middle',fill:'#6d727c','font-size':20},g);tx.textContent=y;});
  const bands=[[2016,2019],[2024,2025]].map(([a,b])=>sv('rect',{x:X(a),y:Y(120),width:0,height:Y(40)-Y(120),fill:'rgba(92,200,255,.13)'},s));
  const bandW=[[2016,2019],[2024,2025]].map(([a,b])=>X(b)-X(a));
  const ys=Object.keys(BIRTHS).map(Number);
  const bp=ys.map(y=>[X(y),Y(BIRTHS[y]/BIRTHS[2016]*100)]), pp=ys.map(y=>[X(y),Y(PIR[y]/PIR[2016]*100)]);
  const lb=sv('path',{fill:'none',stroke:'var(--red)','stroke-width':6,'stroke-linecap':'round','stroke-linejoin':'round'},s);
  const lp=sv('path',{fill:'none',stroke:'var(--cyan)','stroke-width':6,'stroke-linecap':'round','stroke-linejoin':'round'},s);
  const tb=sv('text',{fill:'var(--red)','font-size':26,'font-weight':700},s);tb.textContent='出生數 52';
  const tp=sv('text',{fill:'var(--cyan)','font-size':26,'font-weight':700},s);tp.textContent='房價所得比 104';
  const bl=sv('text',{x:X(2017.5),y:Y(117),'text-anchor':'middle',fill:'var(--cyan)','font-size':20},s);bl.textContent='房價所得比 ↓';
  const head=kinText(root,'房子便宜了，','left:1110px;top:250px;font:900 62px/1.15 var(--sans)');
  const head2=kinText(root,'孩子沒有回來。','left:1110px;top:330px;font:900 62px/1.15 var(--sans);color:var(--red)');
  const sub=el('div','left:1114px;top:450px;width:420px;font:400 22px/1.7 var(--sans);color:var(--dim)',root,'2016→19 房價所得比 −8%<br>出生數 −15%<br><br>2025 房價所得比回落<br>出生數單年 −20%');sub.className='abs';
  return t=>{g.style.opacity=seg(t,.2,.5);
    const p=E.inOut(seg(t,.6,2.6)),a=partial(bp,p),b=partial(pp,p);
    lb.setAttribute('d',a.d);lp.setAttribute('d',b.d);
    tb.setAttribute('x',a.tip[0]-10);tb.setAttribute('y',a.tip[1]+44);tb.setAttribute('text-anchor','end');
    tp.setAttribute('x',b.tip[0]-10);tp.setAttribute('y',b.tip[1]-22);tp.setAttribute('text-anchor','end');
    tb.style.opacity=tp.style.opacity=seg(t,3.1,.4);
    bands.forEach((r,i)=>r.setAttribute('width',bandW[i]*E.outExpo(seg(t,3.6+i*.25,.7))));bl.style.opacity=seg(t,4,.4);
    head.play(t,4.6);head2.play(t,5.2);sub.style.opacity=seg(t,6.2,.5);};}});

/* 06 · counter-evidence: map */

note:'「人流通過門」是最像 AE 的一幕：粒子、遮擋、門變窄。仍然是 t 的純函數（每個粒子的命運由索引決定）。',
build(root){
  el('div',null,root,'<div class="kicker">真正的斷點</div>');
  const head=kinText(root,'成家那道門，先窄了。','left:120px;top:110px;font:900 70px/1 var(--sans)');
  const s=sv('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H,style:'position:absolute;inset:0'},root);
  const CY=500, D=[560,960,1340], OPEN0=320;
  const doorTop=[],doorBot=[];
  D.forEach((x,i)=>{doorTop.push(sv('rect',{x:x-12,width:24,fill:i===0?'var(--amber)':'#cfcac0'},s));doorBot.push(sv('rect',{x:x-12,width:24,fill:i===0?'var(--amber)':'#cfcac0'},s));});
  const names=['成家','婚後第一胎','第二胎以後'];
  names.forEach((n,i)=>{const tx=sv('text',{x:D[i],y:CY+260,'text-anchor':'middle',fill:i===0?'var(--amber)':'var(--dim)','font-size':30,'font-weight':700,style:'font-family:var(--sans)'},s);tx.textContent=n;});
  const N=150, parts=[];
  for(let i=0;i<N;i++)parts.push({y:CY+(rnd(i)-.5)*300,off:rnd(i+99)*10,sp:150+rnd(i+7)*60,f2:rnd(i+31),c:sv('circle',{r:6,fill:'var(--fg)'},s)});
  const m1=el('div','left:610px;top:250px;font:700 96px/1 var(--mono);color:var(--red)',root,'−29%');m1.className='abs';
  const m1s=el('div','left:616px;top:356px;font:400 22px/1.4 var(--sans);color:var(--dim)',root,'結婚對數 147,861 → 104,376');m1s.className='abs';
  const m2=el('div','left:990px;top:300px;font:700 40px/1 var(--mono);color:#cfcac0',root,'1.35 → 0.88');m2.className='abs';
  const m2s=el('div','left:992px;top:350px;font:400 20px/1.4 var(--sans);color:var(--dim)',root,'婚後步調也在變慢');m2s.className='abs';
  return t=>{head.play(t,.2,{stagger:.04});
    const open1=OPEN0*(1-.29*E.inOut(seg(t,2.6,1.2)));
    const opens=[open1,OPEN0*(1-.2*E.inOut(seg(t,5.6,1))),OPEN0];
    D.forEach((x,i)=>{const o=opens[i];doorTop[i].setAttribute('y',CY-200);doorTop[i].setAttribute('height',200-o/2);doorBot[i].setAttribute('y',CY+o/2);doorBot[i].setAttribute('height',200-o/2);doorTop[i].style.opacity=doorBot[i].style.opacity=seg(t,.4+i*.15,.4);});
    parts.forEach(p=>{
      const L=1500, x0=((t*p.sp+p.off*p.sp)%L)+60-p.sp*0;

      const blocked=x>D[0]-14 && Math.abs(p.y-CY)>o1/2;
      if(blocked){x=D[0]-14-(x0-D[0]+14)*.35;op*=1-clamp((x0-D[0])/160);}
      // door 2: after it narrows, a share of couples slow down
      if(!blocked && x>D[1]-14 && p.f2>.72 && (t-(x0-(D[1]-14))/p.sp)>5.6){x=D[1]-14-(x0-D[1]+14)*.35;op*=1-clamp((x0-D[1])/160);}

/* ───────────── player ───────────── */
const stage=document.getElementById('stage');
let starts=[],total=0;
scenes.forEach(s=>{starts.push(total);total+=s.dur;
  s.root=el('div',null,stage);s.root.className='scene';s.update=s.build(s.root);});
const track=document.getElementById('track');
const segs=scenes.map((s,i)=>{const d=el('div',`flex:${s.dur}`,track);d.className='seg';d.title=`${String(i+1).padStart(2,'0')} · ${s.name}`;const f=el('span',null,d);return f;});
let T=0,playing=true,last=performance.now(),cur=-1;
const timeEl=document.getElementById('time'),playBtn=document.getElementById('play');
const md=document.getElementById('md');
function sceneAt(t){let i=0;while(i<scenes.length-1&&t>=starts[i+1])i++;return i;}
function render(t){
  const i=sceneAt(t),s=scenes[i],lt=t-starts[i];
  scenes.forEach((x,j)=>{if(j!==i)x.root.style.opacity=0;});
  s.root.style.opacity=Math.min(i===0?1:seg(lt,0,.35),1-seg(lt,s.dur-.4,.4));
  s.update(lt);
  segs.forEach((f,j)=>f.style.transform=`scaleX(${j<i?1:j>i?0:lt/s.dur})`);
  timeEl.textContent=`${t.toFixed(1).padStart(4,'0')} / ${total.toFixed(1)}`;
  if(i!==cur){cur=i;document.getElementById('mdh').textContent=`SCENE ${String(i+1).padStart(2,'0')} · ${s.name}`;document.getElementById('mdpre').textContent=s.md;document.getElementById('mdnote').textContent=s.note;}
}
function loop(now){const dt=(now-last)/1000;last=now;
  if(playing){T+=dt;if(T>=total){T=total-.001;playing=false;playBtn.textContent='▶';}}
  render(T);requestAnimationFrame(loop);}
function seek(t){T=clamp(t,0,total-.001);render(T);}
function setPlay(v){playing=v;playBtn.textContent=v?'❙❙':'▶';if(v&&T>=total-.01)T=0;}
playBtn.onclick=()=>setPlay(!playing);
document.getElementById('prev').onclick=()=>{const i=sceneAt(T);seek(T-starts[i]>1?starts[i]:starts[Math.max(0,i-1)]);};
document.getElementById('next').onclick=()=>{const i=sceneAt(T);seek(starts[Math.min(scenes.length-1,i+1)]);};
track.addEventListener('pointerdown',e=>{const r=track.getBoundingClientRect();seek((e.clientX-r.left)/r.width*total);
  const mv=ev=>seek((ev.clientX-r.left)/r.width*total);window.addEventListener('pointermove',mv);window.addEventListener('pointerup',()=>window.removeEventListener('pointermove',mv),{once:true});});
const mdBtn=document.getElementById('mdbtn');
mdBtn.onclick=()=>{md.classList.toggle('show');mdBtn.classList.toggle('on');};
document.getElementById('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();setPlay(!playing);}
  else if(e.key==='ArrowRight')document.getElementById('next').click();
  else if(e.key==='ArrowLeft')document.getElementById('prev').click();
  else if(e.key==='m'||e.key==='M')mdBtn.click();
  else if(e.key==='f'||e.key==='F')document.getElementById('fs').click();});
function fit(){const vw=innerWidth,vh=innerHeight-56,k=Math.min(vw/W,vh/H);stage.style.transform=`translate(${-W*k/2}px,${-H*k/2}px) scale(${k})`;stage.style.left=vw/2+'px';stage.style.top=vh/2+'px';}
addEventListener('resize',fit);fit();
// deep link / export hook: ?t=12.5 freezes on that frame (for screenshots or frame-by-frame mp4 export)
const qt=new URLSearchParams(location.search).get('t');
if(qt!==null){T=parseFloat(qt)||0;playing=false;playBtn.textContent='▶';}
window.__seek=seek; window.__total=total;
requestAnimationFrame(loop);
</script>
